# Escaneo semanal de vulnerabilidades conocidas en las dependencias Java (ISO/IEC 27002:2022 8.8
# «Gestión de vulnerabilidades técnicas»). Se ejecuta aparte del CI porque descarga la base de
# datos del NVD (lento). Recomendado: crear el secreto NVD_API_KEY (gratuito en
# https://nvd.nist.gov/developers/request-an-api-key) para acelerar la descarga.
name: Security scan

on:
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP Dependency-Check (falla con CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw -B -DskipTests org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=7 -Dformats=HTML,JSON
          -DnvdApiKey="$NVD_API_KEY"
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 30

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=moderate
